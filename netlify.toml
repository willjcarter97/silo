[build]
  command = "npm run build"
  publish = "dist"

# SPA routing. Pages pre-rendered by scripts/build-seo.mjs (dist/<path>.html) are served as files
# first; any other route falls back to spa.html, the generic shell without a canonical tag. (index.html
# is now the home page's own HTML, so it must not be the fallback.)
[[redirects]]
  from = "/*"
  to = "/spa.html"
  status = 200

# Security headers
# Prismic previews: static.cdn.prismic.io + prismic.io (toolbar script), silosite.prismic.io (toolbar frame and
# preview API). The toolbar only loads on /preview or while the preview cookie is set.
# HubSpot (portal 442547962, ap1): track-ap1.hubspot.com in img-src is the page-view pixel (it was blocked
# until 30 Oct 2026, so HubSpot recorded no visits); api.hsforms.com in connect-src is the Forms API used by
# src/lib/forms.js.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cdn.prismic.io https://prismic.io https://www.googletagmanager.com https://js-ap1.hs-scripts.com https://js-ap1.hs-analytics.net https://js-ap1.hscollectedforms.net https://js-ap1.hs-banner.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://images.prismic.io https://silosite.cdn.prismic.io https://res.cloudinary.com https://track-ap1.hubspot.com https://forms-ap1.hsforms.com; font-src 'self' https://fonts.gstatic.com; media-src 'self' blob: https://images.prismic.io https://silosite.cdn.prismic.io https://res.cloudinary.com; connect-src 'self' https://silosite.cdn.prismic.io https://silosite.prismic.io https://www.google-analytics.com https://region1.google-analytics.com https://stats.g.doubleclick.net https://forms-ap1.hscollectedforms.net https://api.hubspot.com https://track-ap1.hubspot.com https://api.hsforms.com; frame-src 'self' https://silosite.prismic.io https://player.vimeo.com https://www.youtube.com; object-src 'none';"

# Environment variables per context
[context.production.environment]
  VITE_ENV = "production"

[context.deploy-preview.environment]
  VITE_ENV = "staging"

[context.branch-deploy.environment]
  VITE_ENV = "staging"

# Cache static assets for a long time
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


