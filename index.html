<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preconnect FIRST - establish early connections to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.prismic.io" crossorigin />
    <link rel="preconnect" href="https://silosite.cdn.prismic.io" crossorigin />
    <!-- HubSpot preconnects -->
    <link rel="preconnect" href="https://track-ap1.hubspot.com" crossorigin />
    <link rel="preconnect" href="https://forms-ap1.hscollectedforms.net" crossorigin />
    <link rel="preconnect" href="https://js-ap1.hscollectedforms.net" crossorigin />
    <link rel="preconnect" href="https://js-ap1.hs-scripts.com" crossorigin />
    <link rel="preconnect" href="https://js-ap1.hs-analytics.net" crossorigin />
    
    <!-- Preload critical font files to prevent CLS from font swap -->
    <link rel="preload" href="https://fonts.gstatic.com/s/dmsans/v15/rP2Yp2ywxg089UriI5-g4vlH9VoD8Cmcqbu0-K4.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://fonts.gstatic.com/s/epilogue/v17/O4ZRFGj5hxF0EhjimlIhqAYaY7EBcUSL-HAu.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Google Fonts - non-blocking load with fallback -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Epilogue:wght@300;400;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Epilogue:wght@300;400;500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://images.prismic.io/silosite/aVUrRnNYClf9otud_favicon-16x16_wmoo6x.png?auto=format,compress"
    />
    
    <title>Silo | Modern Creative Agency for Social, Brand & Web.</title>
    <meta
      name="description"
      content="A modern creative studio specialising in social media strategy, content strategy, brand identity design, web design and custom website development for growing brands."
    />

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Silo" />
    <meta
      property="og:title"
      content="Silo | Modern Creative Agency for Social, Brand & Web."
    />
    <meta
      property="og:description"
      content="A modern creative studio specialising in social media strategy, content strategy, brand identity design, web design and custom website development for growing brands."
    />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Silo | Modern Creative Agency for Social, Brand & Web."
    />
    <meta
      name="twitter:description"
      content="A modern creative studio specialising in social media strategy, content strategy, brand identity design, web design and custom website development for growing brands."
    />

    <!-- Google Analytics - deferred to not block render -->
    <script
      async
      defer
      src="https://www.googletagmanager.com/gtag/js?id=G-77WXY85ZDY"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-77WXY85ZDY");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- HubSpot - deferred loading after page is interactive to improve FCP/LCP -->
    <script>
      window.addEventListener('load', function() {
        // Delay HubSpot by 2 seconds after load to prioritize core content
        setTimeout(function() {
          var script = document.createElement('script');
          script.type = 'text/javascript';
          script.id = 'hs-script-loader';
          script.async = true;
          script.src = '//js-ap1.hs-scripts.com/442547962.js';
          document.body.appendChild(script);
        }, 2000);
      });
    </script>
  </body>
</html>
